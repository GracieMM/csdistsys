
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Registration Form</title>

    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Roboto:400,700">

    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">

    <style>
        body {
            color: #fff;
            background: #63738a;
            font-family: 'Roboto', sans-serif;
        }

        .form-control {
            height: 40px;
            box-shadow: none;
            color: #969fa4;
        }

        .form-control:focus {
            border-color: #5cb85c;
        }

        .signup-form {
            width: 450px;
            max-width: 95%;
            margin: 0 auto;
            padding: 30px 0;
            font-size: 15px;
        }

        .signup-form h2 {
            color: #636363;
            margin-bottom: 15px;
            text-align: center;
        }

        .signup-form form {
            color: #999;
            border-radius: 3px;
            background: #f2f3f7;
            box-shadow: 0 2px 2px rgba(0,0,0,0.3);
            padding: 30px;
        }

        .signup-form .hint-text {
            color: #999;
            margin-bottom: 30px;
            text-align: center;
        }

        .signup-form .form-group {
            margin-bottom: 20px;
        }

        .signup-form .btn {
            font-size: 16px;
            font-weight: bold;
        }

        .signup-form a {
            color: #fff;
        }

        .signup-form form a {
            color: #5cb85c;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="signup-form">

    <form method="POST">

        <h2>Fill Data</h2>

        <p class="hint-text">Fill below form.</p>

        <div class="form-group">
            <div class="row">
                <div class="col">
                    <input type="text"
                    class="form-control"
                    name="fname"
                    placeholder="First Name"
                    required>
                </div>

                <div class="col">
                    <input type="text"
                    class="form-control"
                    name="lname"
                    placeholder="Last Name"
                    required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <input type="text"
            class="form-control"
            name="contactno"
            placeholder="Enter your Mobile Number"
            required maxlength="10"
            pattern="[0-9]+">
        </div>

        <div class="form-group">
            <input type="email"
            class="form-control"
            name="email"
            placeholder="Enter your Email id"
            required>
        </div>

        <div class="form-group">
            <textarea class="form-control"
            name="address"
            placeholder="Enter Your Address"
            required></textarea>
        </div>

        <div class="form-group">
            <button type="submit"
            class="btn btn-success btn-lg btn-block"
            name="submit">
                Submit
            </button>
        </div>

    </form>

    <div class="text-center">
        View Already Inserted Data!!
        <a href="index.php">View</a>
    </div>

</div>

</body>
</html>
